name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  bun-audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Audit dependencies
        # The repo is bun-managed (bun.lock); bun audit reads it directly.
        # Production focus: runtime deps are what ships to consumers.
        run: bun audit --production

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        # gitleaks-action@v2 requires a paid GITLEAKS_LICENSE secret; the
        # binary itself is MIT — run it directly.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
        # Requires the repo's Dependency Graph (owner setting) — until
        # enabled, report without blocking.
        continue-on-error: true
