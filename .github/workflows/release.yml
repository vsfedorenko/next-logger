name: Release

# Publishes to npm when a GitHub Release is published, or on manual dispatch.
# Runs build + tests as gates before publishing.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Required for npm provenance attestation (trusted publishing via OIDC).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/next-logger
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
