name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Run vitest under the matrix Node version (the published package runs
      # on user Node versions; bun is only the install/orchestration layer).
      - name: Test
        run: cd packages/next-logger && ../../../node_modules/.bin/vitest run
      - name: Test coverage
        if: matrix.node-version == 24
        run: cd packages/next-logger && ../../../node_modules/.bin/vitest run --coverage
      - name: Upload coverage report
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/next-logger/coverage/
      - run: bun run build

  e2e:
    name: E2E (Next 16 Turbopack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
